# Keeps data/episodes.json current so the static site (GitHub Pages) always lists the
# latest Real Yield, The Close and Money Stuff episodes.
name: Update episodes

on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/media.js
      - server/episodes.mjs
      - scripts/update-episodes.mjs
      - .github/workflows/episodes.yml

permissions:
  contents: write

concurrency:
  group: episodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # On manual or push runs, also record whether captions are reachable from a
      # cloud network (tells us if a hosted transcript server would work).
      - name: Fetch latest episodes
        run: node scripts/update-episodes.mjs ${{ github.event_name != 'schedule' && '--probe' || '' }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update episode list"
            git pull --rebase origin main
            git push
          fi
